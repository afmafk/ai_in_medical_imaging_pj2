# SwinUNETR — same train/eval protocol as task3_compare; smaller feature_size for 16GB GPU
data_root: outputs_task1/processed_3d
metadata_path: outputs_task1/metadata.json
splits_path: splits_patient_seed42.json

split_ratios: [0.7, 0.1, 0.2]
split_seed: 42

modalities: [t1n, t1c, t2w, t2f]
num_classes: 4

use_full_volume: false
eval_sliding_window: true
sliding_window_stride: 48
patch_size: [96, 96, 96]
volume_shape: [155, 177, 219]
train_samples_per_patient: 2

augmentation:
  flip_prob_hw: 0.5
  flip_prob_depth: 0.15
  rotate_prob: 0.3
  rotate_degrees: 10.0
  scale_prob: 0.25
  scale_range: [0.9, 1.1]
  intensity_prob: 1.0
  intensity_scale_range: [0.9, 1.1]
  intensity_shift_range: [-0.1, 0.1]
  noise_prob: 0.4
  noise_std_range: [0.0, 0.05]
  blur_prob: 0.2
  blur_sigma_range: [0.5, 1.0]

device: cuda
require_gpu: true
use_compile: false
channels_last: false

batch_size: 4
accum_steps: 1
num_workers: 6
prefetch_factor: 4
persistent_workers: true
slice_load_threads: 12

optimizer: adam
lr: 0.0001
weight_decay: 0.00001

max_epochs: 300
early_stop_patience: 30
early_stop_min_delta: 0.001
scheduler: plateau
scheduler_patience: 10
scheduler_factor: 0.5

loss_ce_weight: 1.0
loss_dice_weight: 1.0

swinunetr:
  feature_size: 12
  use_v2: true
  use_checkpoint: false

max_patients: null
