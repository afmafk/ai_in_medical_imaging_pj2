# TAF-TransBTS: four modality encoders + deepest tri-attention fusion.
# Sized for a 40 GB CUDA GPU. Start with batch_size=4; use 2 with accum_steps=2
# only if the actual cluster GPU has less memory than expected.
data_root: outputs_task1/processed_3d
metadata_path: outputs_task1/metadata.json
splits_path: splits_patient_seed42.json

split_ratios: [0.7, 0.1, 0.2]
split_seed: 42
seed: 42

modalities: [t1n, t1c, t2w, t2f]
num_classes: 4

use_full_volume: false
eval_sliding_window: true
full_val_interval: 10
sliding_window_stride: 48
patch_size: [96, 96, 96]
volume_shape: [155, 177, 219]
train_samples_per_patient: 2

# Keep the baseline augmentation protocol for a controlled architecture test.
augmentation:
  flip_prob_hw: 0.5
  flip_prob_depth: 0.15
  rotate_prob: 0.3
  rotate_degrees: 10.0
  scale_prob: 0.25
  scale_range: [0.9, 1.1]
  intensity_prob: 1.0
  intensity_scale_range: [0.9, 1.1]
  intensity_shift_range: [-0.1, 0.1]
  noise_prob: 0.4
  noise_std_range: [0.0, 0.05]
  blur_prob: 0.2
  blur_sigma_range: [0.5, 1.0]

device: cuda
require_gpu: true
use_compile: false
channels_last: true

batch_size: 4
accum_steps: 1
# Compressed .npz input is CPU-heavy. Four persistent workers plus a small
# per-worker LRU cache are usually steadier than aggressive I/O concurrency.
num_workers: 4
prefetch_factor: 2
persistent_workers: true
slice_load_threads: 1
volume_cache_size: 4

optimizer: adam
lr: 0.0005
weight_decay: 0.00001

max_epochs: 250
early_stop_patience: 12
early_stop_min_delta: 0.001
scheduler: plateau
scheduler_patience: 4
scheduler_factor: 0.5

loss_ce_weight: 1.0
loss_dice_weight: 1.0
# Let segmentation stabilize before introducing the correlation teacher loss.
# The stop-gradient KL is intentionally conservative for the first rerun.
loss_correlation_weight: 0.005
loss_correlation_start_epoch: 30
loss_correlation_warmup_epochs: 20
max_grad_norm: 5.0

taf_transbts:
  base: 24
  transformer_depth: 2
  transformer_heads: 8
  correlation_temperature: 1.0

max_patients: null
